# Local development database only: npm run db:up
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: handahana
      POSTGRES_PASSWORD: handahana
      POSTGRES_DB: handahana
    ports:
      # 5433 on the host, so it doesn't clash with a locally installed Postgres.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
