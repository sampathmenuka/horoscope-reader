# Local development database only: npm run db:up
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: handahana
      POSTGRES_PASSWORD: handahana
      POSTGRES_DB: handahana
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
